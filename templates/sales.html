{% extends 'base.html' %}
{% block title %}விற்பனை வரலாறு{% endblock %}
{% block page_title %}விற்பனை வரலாறு{% endblock %}

{% block content %}
<div class="page-toolbar">
  <div class="toolbar-left">
    <div class="search-input-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="saleSearch" placeholder="ரசீது # தேடுக..." class="search-input" style="width:200px">
    </div>
    <select id="paymentFilter" class="form-select" style="width:auto">
      <option value="">அனைத்து கட்டணமும்</option>
      <option value="cash">💵 ரொக்கம்</option>
      <option value="upi">📱 UPI</option>
      <option value="card">💳 Card</option>
    </select>
  </div>
</div>

<div class="card">
  <div class="card-body p0">
    <table class="table">
      <thead>
        <tr>
          <th>ரசீது #</th>
          <th>வாடிக்கையாளர்</th>
          <th>பொருட்கள்</th>
          <th>கட்டணம்</th>
          <th>வரி (GST)</th>
          <th>மொத்தம்</th>
          <th>தேதி</th>
          <th>செயல்கள்</th>
        </tr>
      </thead>
      <tbody id="salesTbody">
        <tr><td colspan="8" class="text-center text-muted">ஏற்றுகிறது...</td></tr>
      </tbody>
    </table>
  </div>
  <div class="card-footer">
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<!-- Receipt Detail Modal -->
<div class="modal" id="saleModal">
  <div class="modal-dialog modal-sm">
    <div class="modal-header">
      <h3>🧾 GST ரசீது விவரம்</h3>
      <button class="modal-close" onclick="closeModal('saleModal')">✕</button>
    </div>
    <div class="modal-body" id="saleModalContent"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('saleModal')">மூடு</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;

async function loadSales(page = 1) {
  const q = document.getElementById('saleSearch').value;
  const payment = document.getElementById('paymentFilter').value;
  const params = new URLSearchParams({ page, per_page: 20 });
  if (q) params.set('q', q);
  if (payment) params.set('payment', payment);
  const res = await fetch('/api/sales?' + params);
  const data = await res.json();
  renderSales(data.sales);
  renderPagination(data.current_page, data.pages);
  currentPage = page;
}

function renderSales(sales) {
  const tbody = document.getElementById('salesTbody');
  if (!sales.length) { tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">விற்பனை இல்லை</td></tr>'; return; }
  tbody.innerHTML = sales.map(s => {
    const gstTotal = (s.total_cgst || 0) + (s.total_sgst || 0);
    return `<tr>
      <td><span class="sale-id">#${s.id}</span></td>
      <td>${s.customer}</td>
      <td>${s.item_count} பொருட்கள்</td>
      <td><span class="badge badge--${s.payment_method}">${payLabel(s.payment_method)}</span></td>
      <td class="text-muted text-sm">${fmt(gstTotal)}</td>
      <td class="fw-600">${fmt(s.total)}</td>
      <td class="text-muted text-sm">${s.created_at}</td>
      <td>
        <div class="action-btns">
          <button class="btn btn-ghost btn-sm" onclick="viewSale(${s.id})">👁 காண</button>
          <button class="btn btn-ghost btn-sm text-danger" onclick="deleteSale(${s.id})">🗑️</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function renderPagination(current, total) {
  const pg = document.getElementById('pagination');
  if (total <= 1) { pg.innerHTML = ''; return; }
  let html = '';
  if (current > 1) html += `<button class="page-btn" onclick="loadSales(${current-1})">← முந்தையது</button>`;
  for (let i = Math.max(1, current-2); i <= Math.min(total, current+2); i++)
    html += `<button class="page-btn ${i===current?'active':''}" onclick="loadSales(${i})">${i}</button>`;
  if (current < total) html += `<button class="page-btn" onclick="loadSales(${current+1})">அடுத்தது →</button>`;
  pg.innerHTML = html;
}

async function viewSale(id) {
  const res = await fetch(`/api/sales/${id}`);
  const s = await res.json();
  document.getElementById('saleModalContent').innerHTML = `
    <div class="receipt">
      <div class="receipt-header">
        <div class="receipt-logo">🏪 மாணிக்கம் ஸ்டோர்ஸ்</div>
        <div style="font-size:11px;color:#94a3b8">GSTIN: 33AABCU9603R1ZX · Tamil Nadu</div>
        <div class="receipt-id">ரசீது #${s.id}</div>
        <div class="receipt-date">${s.created_at}</div>
        <div class="receipt-customer">வாடிக்கையாளர்: ${s.customer}</div>
        <div class="receipt-payment">கட்டணம்: ${payLabel(s.payment_method)}</div>
      </div>
      <div class="receipt-divider"></div>
      <div class="receipt-items">
        ${s.items.map(i => `
          <div class="receipt-item">
            <div>
              <div>${i.product_name}</div>
              <div class="text-muted text-sm">${i.quantity} × ${fmt(i.price)} | HSN: ${i.hsn_code||'—'} | GST ${i.gst_rate}%</div>
              <div class="text-muted text-sm">வரிக்குரிய: ${fmt(i.taxable)} | CGST: ${fmt(i.cgst)} | SGST: ${fmt(i.sgst)}</div>
            </div>
            <div>${fmt(i.subtotal)}</div>
          </div>
        `).join('')}
      </div>
      <div class="receipt-divider"></div>
      <div class="receipt-totals">
        <div class="receipt-row"><span>வரிக்குரிய தொகை</span><span>${fmt(s.subtotal)}</span></div>
        <div class="receipt-row"><span>CGST</span><span>${fmt(s.total_cgst)}</span></div>
        <div class="receipt-row"><span>SGST</span><span>${fmt(s.total_sgst)}</span></div>
        ${s.discount > 0 ? `<div class="receipt-row"><span>தள்ளுபடி</span><span>-${fmt(s.discount)}</span></div>` : ''}
        <div class="receipt-row receipt-row--total"><span>மொத்தம்</span><span>${fmt(s.total)}</span></div>
        <div class="receipt-row"><span>பெற்ற தொகை</span><span>${fmt(s.amount_paid)}</span></div>
        ${s.change_given > 0 ? `<div class="receipt-row"><span>திரும்ப</span><span>${fmt(s.change_given)}</span></div>` : ''}
      </div>
    </div>
  `;
  openModal('saleModal');
}

async function deleteSale(id) {
  if (!confirm('இந்த விற்பனையை ரத்து செய்யவா? இருப்பு திரும்ப வரும்.')) return;
  const res = await fetch(`/api/sales/${id}`, { method: 'DELETE' });
  if (res.ok) { showToast('விற்பனை ரத்து செய்யப்பட்டது', 'success'); loadSales(currentPage); }
}

let st;
document.getElementById('saleSearch').addEventListener('input', () => { clearTimeout(st); st = setTimeout(() => loadSales(1), 300); });
document.getElementById('paymentFilter').addEventListener('change', () => loadSales(1));
loadSales();
</script>
{% endblock %}
