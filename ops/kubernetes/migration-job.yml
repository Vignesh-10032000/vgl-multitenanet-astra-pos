apiVersion: batch/v1
kind: Job
metadata:
  name: vglpos-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/example/vglpos:replace-at-deploy
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: vglpos-config}
            - secretRef: {name: vglpos-secrets}
