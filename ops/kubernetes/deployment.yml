apiVersion: apps/v1
kind: Deployment
metadata:
  name: vglpos
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: vglpos}
  template:
    metadata:
      labels: {app: vglpos}
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: app
          image: ghcr.io/example/vglpos:replace-at-deploy
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: vglpos-config}
            - secretRef: {name: vglpos-secrets}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: vglpos
spec:
  selector: {app: vglpos}
  ports: [{name: http, port: 80, targetPort: http}]
