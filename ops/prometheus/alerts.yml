groups:
  - name: vglpos-operational
    rules:
      - alert: CheckoutP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{route="/api/v1/sales/checkout"}[5m]))) > 1
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: Checkout p99 exceeds one second
          runbook_url: /docs/runbook.md#checkout-latency
      - alert: HttpErrorRateHigh
        expr: sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_request_duration_seconds_count[5m])), 1) > 0.01
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: HTTP error rate exceeds one percent
          runbook_url: /docs/runbook.md#http-errors
      - alert: OfflineQueueHigh
        expr: offline_queue_depth > 100
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: More than 100 offline bills await synchronization
          runbook_url: /docs/runbook.md#offline-queue
      - alert: EInvoiceQueueHigh
        expr: einvoice_pending_total > 50
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: More than 50 e-invoices are pending
          runbook_url: /docs/runbook.md#e-invoice-queue
      - alert: BackupFailed
        expr: time() - vglpos_backup_last_success_timestamp_seconds > 93600
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: No successful nightly backup in 26 hours
          runbook_url: /docs/runbook.md#backup-failure
      - alert: DiskUsageHigh
        expr: 100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) > 80
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Disk utilization exceeds 80 percent
          runbook_url: /docs/runbook.md#disk-capacity
      - alert: ReplicationLagHigh
        expr: pg_replication_lag_seconds > 30
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: PostgreSQL replication lag exceeds 30 seconds
          runbook_url: /docs/runbook.md#replication-lag
