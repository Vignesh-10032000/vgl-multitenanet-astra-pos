services:
  prometheus:
    image: prom/prometheus:v3.7.3
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${METRICS_TOKEN_FILE:?set METRICS_TOKEN_FILE}:/run/secrets/metrics_token:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:12.2.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${GRAFANA_PASSWORD_FILE:?set GRAFANA_PASSWORD_FILE}:/run/secrets/grafana_admin_password:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.18.1
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_URL:?set POSTGRES_EXPORTER_URL}
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    volumes:
      - ./postgres-exporter/queries.yml:/etc/postgres-exporter/queries.yml:ro
    ports: ["127.0.0.1:9187:9187"]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command: ["--path.rootfs=/host", "--collector.textfile.directory=/var/lib/node_exporter"]
    volumes:
      - /:/host:ro,rslave
      - ${BACKUP_METRICS_DIR:?set BACKUP_METRICS_DIR}:/var/lib/node_exporter:ro
    ports: ["127.0.0.1:9100:9100"]

volumes:
  prometheus-data:
  grafana-data:
