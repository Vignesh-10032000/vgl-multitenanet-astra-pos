version: "2"
# REPLACE WITH YOUR ACTUAL NGROK AUTHTOKEN FROM THE DASHBOARD
# Or run 'ngrok config add-authtoken <your-token>' in terminal
authtoken: YOUR_NGROK_AUTHTOKEN

# Region: India (in) for best latency
region: in

tunnels:
  pos:
    addr: 5000
    proto: http
    host_header: localhost:5000
    # Custom domain setup (Only works if you upgrade your ngrok plan):
    # To use a custom domain, uncomment the line below and replace with your domain:
    # hostname: cycling-jab-traction.ngrok-free.dev
