name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 20 * * *"
    - cron: "0 2 1 * *"
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build hashed frontend assets
        run: npm run build

      - name: Frontend unit and asset-budget tests
        run: npm test

      - name: Offline Python-JavaScript tax parity
        run: npm run test:tax-parity

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Sync environment (frozen)
        run: uv sync --frozen --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy --strict (services, repositories, utils)
        run: uv run mypy --strict src/vglpos/services src/vglpos/repositories src/vglpos/utils

      - name: Tests with coverage
        run: uv run pytest --cov --cov-fail-under=80

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser billing and receipt gate
        run: npx playwright test tests/e2e/billing.spec.ts tests/e2e/offline.spec.ts

      - name: Export pinned requirements for audit
        run: uv export --no-emit-project --format requirements-txt -o .audit-requirements.txt

      - name: pip-audit
        run: uv run pip-audit --disable-pip -r .audit-requirements.txt

  nightly-load:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vglpos
          POSTGRES_PASSWORD: vglpos-performance-only
          POSTGRES_DB: vglpos_perf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vglpos -d vglpos_perf_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://vglpos:vglpos-performance-only@127.0.0.1:5432/vglpos_perf_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: nightly-performance-secret-key-not-for-real-deployments
      JWT_SECRET_KEY: nightly-performance-jwt-key-not-for-real-deployments
      OFFLINE_SYNC_SIGNING_SECRET: nightly-offline-sync-key-not-for-real-deployments
      METRICS_AUTH_TOKEN: nightly-metrics-token-not-for-real-deployments
      RATELIMIT_ENABLED: "false"
      VGLPOS_ALLOW_PERFORMANCE_SEED: "1"
      PERF_LOGIN_CODE: PERF
      PERF_USERNAME: cashier
      PERF_PASSWORD: Performance-only-password-42!
      PERF_CASHIER_COUNT: "150"
      PERF_BRANCH_ID: "1"
      PERF_TERMINAL_ID: "1"
      PERF_BARCODES: PERF-00001,PERF-00002,PERF-00003,PERF-00004,PERF-00005
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Sync environment (frozen)
        run: uv sync --frozen --all-groups

      - name: Migrate and seed performance database
        run: |
          uv run alembic upgrade head
          uv run python scripts/seed_performance.py

      - name: Capture before and after query plans
        run: |
          uv run alembic downgrade 0012
          uv run python scripts/capture_query_plans.py --label before > query-plans-before.txt
          uv run alembic upgrade head
          uv run python scripts/capture_query_plans.py --label after > query-plans-after.txt

      - name: Start application
        run: |
          uv run gunicorn --bind 127.0.0.1:8000 --workers 4 --timeout 120 'vglpos.app:create_app()' > gunicorn.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat gunicorn.log
          exit 1

      - name: Run 150-cashier Phase 10 load gate
        run: >-
          uv run locust -f tests/load/locustfile.py --headless
          -u 150 -r 10 -t 15m --host http://127.0.0.1:8000
          --csv load-results --html load-report.html

      - name: Prove authentication rate limits under load
        run: |
          RATELIMIT_ENABLED=true uv run gunicorn --bind 127.0.0.1:8001 --workers 2 --timeout 120 'vglpos.app:create_app()' > rate-limit-gunicorn.log 2>&1 &
          rate_limit_ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/ready; then
              rate_limit_ready=1
              break
            fi
            sleep 2
          done
          if [[ "$rate_limit_ready" != "1" ]]; then
            cat rate-limit-gunicorn.log
            exit 1
          fi
          uv run locust -f tests/load/rate_limit_locustfile.py --headless \
            -u 25 -r 25 -t 30s --host http://127.0.0.1:8001

      - name: Upload load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-load-results
          path: |
            load-results*.csv
            load-report.html
            gunicorn.log
            rate-limit-gunicorn.log
            query-plans-before.txt
            query-plans-after.txt

  security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: security-owner-only
          POSTGRES_DB: vglpos_security_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vglpos_security_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:security-owner-only@127.0.0.1:5432/vglpos_security_test
      SECURITY_DATABASE_OWNER_URL: postgresql://postgres:security-owner-only@127.0.0.1:5432/vglpos_security_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv python install
      - run: uv sync --frozen --all-groups
      - name: Create schema and least-privilege role
        run: |
          uv run alembic upgrade head
          psql "$SECURITY_DATABASE_OWNER_URL" -f scripts/configure_app_role.sql
      - name: Exercise security controls
        run: uv run pytest tests/security -q

  monthly-restore-drill:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 1 * *'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: restore-drill-only
          POSTGRES_DB: vglpos_restore_source_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vglpos_restore_source_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:restore-drill-only@127.0.0.1:5432/vglpos_restore_source_test
      BACKUP_DATABASE_URL: postgresql://postgres:restore-drill-only@127.0.0.1:5432/vglpos_restore_source_test
      DRILL_ADMIN_URL: postgresql://postgres:restore-drill-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv python install
      - run: uv sync --frozen --all-groups
      - name: Install PostgreSQL and age clients
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client age
      - name: Prepare disposable encrypted backup
        run: |
          uv run alembic upgrade head
          mkdir -p "$RUNNER_TEMP/backups"
          age-keygen -o "$RUNNER_TEMP/age-identity.txt"
          echo "AGE_RECIPIENT=$(age-keygen -y "$RUNNER_TEMP/age-identity.txt")" >> "$GITHUB_ENV"
          echo "AGE_IDENTITY_FILE=$RUNNER_TEMP/age-identity.txt" >> "$GITHUB_ENV"
          echo "BACKUP_OUTPUT_DIR=$RUNNER_TEMP/backups" >> "$GITHUB_ENV"
      - name: Backup and prove restore RTO/integrity
        run: |
          bash scripts/backup_postgres.sh
          bash scripts/restore_drill.sh | tee restore-drill.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-restore-drill
          path: restore-drill.log
