name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Sync environment (frozen)
        run: uv sync --frozen --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy --strict (services, repositories, utils)
        run: uv run mypy --strict src/vglpos/services src/vglpos/repositories src/vglpos/utils

      - name: Tests with coverage
        run: uv run pytest --cov --cov-fail-under=80

      - name: Export pinned requirements for audit
        run: uv export --no-emit-project --format requirements-txt -o .audit-requirements.txt

      - name: pip-audit
        run: uv run pip-audit --disable-pip -r .audit-requirements.txt
