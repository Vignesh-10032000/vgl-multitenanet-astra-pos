{% extends "base.html" %} {% block title %}Dashboard · Restaurant POS{% endblock
%} {% block content %}
<section class="dashboard-welcome" aria-labelledby="dashboard-heading">
  <div>
    <p class="eyebrow" id="dashboard-brand"></p>
    <h1 id="dashboard-heading"></h1>
    <p id="dashboard-subtitle"></p>
  </div>
  <a href="#billing" class="button dashboard-hero-button"
    ><i data-lucide="plus"></i><span data-label="newBill"></span
    ><i data-lucide="arrow-up-right"></i
  ></a>
</section>
<div class="dashboard-toolbar">
  <div>
    <strong data-label="performance"></strong>
    <p data-label="correctionHint"></p>
  </div>
</div>
<form
  id="dashboard-filter"
  class="period-filter"
  aria-label="Dashboard filters"
></form>
<p id="dashboard-error" class="form-error" role="alert"></p>
<div id="dashboard-content" aria-busy="true">
  <section
    class="metric-grid dashboard-metrics"
    aria-label="Sales performance"
    id="dashboard-metrics"
  ></section>
  <section id="dashboard-period-revenue" class="period-revenue-grid" aria-label="Weekly and monthly revenue"></section>
  <section class="dashboard-overview-grid">
    <article class="panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow" data-label="period"></p>
          <h2 data-label="paymentSplit"></h2>
        </div>
        <i data-lucide="wallet"></i>
      </div>
      <div class="dashboard-payment-list" id="payment-mix"></div>
      <p class="panel-note" data-label="paymentHint"></p>
    </article>
    <article class="panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow" data-label="unitsHint"></p>
          <h2 data-label="topItems"></h2>
        </div>
        <i data-lucide="chart-no-axes-combined"></i>
      </div>
      <div class="dashboard-ranked-list" id="top-products"></div>
    </article>
  </section>
  <section class="panel table-panel">
    <div class="section-heading">
      <div>
        <p class="eyebrow" data-label="period"></p>
        <h2 data-label="lastBills"></h2>
      </div>
      <a class="text-button" href="#sales"
        ><span data-label="viewSales"></span><i data-lucide="arrow-up-right"></i
      ></a>
    </div>
    <div class="dashboard-recent-table">
      <table>
        <thead>
          <tr>
            <th data-label="bill"></th>
            <th data-label="customer"></th>
            <th data-label="dateTime"></th>
            <th data-label="payment"></th>
            <th data-label="status"></th>
            <th data-label="billTotal"></th>
          </tr>
        </thead>
        <tbody id="recent-sales"></tbody>
      </table>
    </div>
  </section>
</div>
{% endblock %}
