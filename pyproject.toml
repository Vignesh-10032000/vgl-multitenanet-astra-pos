[project]
name = "vglpos"
version = "0.1.0"
description = "VGL POS - GST-compliant retail point of sale for Indian retail"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "flask==3.1.3",
    "flask-sqlalchemy==3.1.1",
    "flask-migrate==4.1.0",
    "flask-jwt-extended==4.7.4",
    "flask-limiter==4.1.1",
    "flask-caching==2.5.1",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "celery==5.6.3",
    "redis==8.1.0",
    "argon2-cffi==25.1.0",
    "gunicorn==26.2.0",
    "structlog==26.1.0",
    "python-dateutil==2.9.0.post0",
    "pyotp==2.10.0",
    "pillow==12.3.0",
    "qrcode[pil]==8.2",
    "prometheus-client==0.26.0",
    "sentry-sdk[celery,flask,sqlalchemy]==2.71.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-postgresql==9.1.0",
    "hypothesis==6.168.3",
    "factory-boy==3.3.3",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "locust==2.46.6",
    "playwright==1.63.0",
    "pytest-repeat==0.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vglpos"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The pre-rewrite prototype is preserved verbatim; it is reference material,
# not part of the codebase quality gate.
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
    "T20", # no print statements
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["vglpos"]
# celery_app is a process entry point (like wsgi); it only runs under a celery worker.
omit = ["*/celery_app.py"]

[tool.coverage.report]
show_missing = true
